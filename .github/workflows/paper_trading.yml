name: Paper Trading Loop

on:
  schedule:
    # هر ۲ ساعت، نه هر ۱۵ دقیقه. دلیلش اندازه‌گیری‌شده است: با cron */15،
    # میانهٔ فاصلهٔ واقعی بین ۳۰ اجرا **۱۹۶ دقیقه** بود (بیشینه ۳۱۸) یعنی
    # ۷.۳ اجرا در روز به‌جای ۹۶ — گیت‌هاب زمان‌بندی‌های پرتکرار را throttle
    # می‌کند و cron کم‌تکرار را قابل‌اعتمادتر اجرا می‌کند. به‌جای تکیه بر cron،
    # هر اجرا حلقهٔ داخلی خودِ اسکریپت را با فاصلهٔ ۱۵ دقیقه می‌چرخاند
    # (~۷ چرخه در هر اجرا × ۱۲ اجرا ≈ ۸۴ چرخه در روز).
    #
    # چرا ۲ ساعت و نه ۶ (سقف job گیت‌هاب): حافظهٔ ربات در انتهای job ذخیره
    # می‌شود، پس طول job یعنی حداکثر دادهٔ قابل‌ازدست‌رفتن. ۲ ساعت این را
    # محدود نگه می‌دارد و حافظه ۱۲ بار در روز ذخیره می‌شود.
    #
    # ریپو عمومی است و دقایق Actions برای ریپوهای عمومی نامحدود است، پس job
    # طولانی هزینهٔ سهمیه‌ای ندارد.
    - cron: '0 */2 * * *'
  workflow_dispatch:        # Allow manual trigger from GitHub UI

concurrency:
  group: paper-trading   # اگه اجرای قبلی هنوز تموم نشده، اجرای جدید صف می‌شه نه هم‌زمان —
  cancel-in-progress: false  # وگرنه دو اجرای هم‌زمان روی شاخهٔ paper-trading-state رقابت می‌کنن

permissions:
  contents: write   # لازم برای ذخیرهٔ حافظهٔ ربات در شاخهٔ paper-trading-state

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bot memory from previous run
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin paper-trading-state > /dev/null 2>&1; then
            git fetch --depth=1 origin paper-trading-state
            git archive FETCH_HEAD | tar -x -C data
            echo "حافظهٔ قبلی بازیابی شد"
          else
            echo "حافظهٔ قبلی وجود نداره — شروع از صفر"
          fi

      - name: Run paper trading (looping ~110 minutes, one cycle every 15)
        # کمتر از فاصلهٔ cron (۱۲۰ دقیقه) تا دو اجرا هم‌پوشانی نکنند، و کمتر از
        # سقف ۶ ساعتهٔ job. با رسیدن به این مهلت، job قطع می‌شود و مرحلهٔ بعدی
        # (always) حافظه را ذخیره می‌کند.
        timeout-minutes: 110
        env:
          NOBITEX_ENV: testnet
          NOBITEX_API_KEY: ${{ secrets.NOBITEX_API_KEY }}
          NOBITEX_API_SECRET: ${{ secrets.NOBITEX_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # بدون --once: حلقهٔ داخلی اسکریپت هر ۱۵ دقیقه یک چرخه می‌زند تا مهلت
        # job برسد. با `|| true` چون قطع‌شدن به‌خاطر timeout خطا نیست و نباید
        # مرحلهٔ ذخیرهٔ حافظه را به‌عنوان شکست علامت بزند.
        run: python scripts/run_paper_trading.py --approval notify --interval-minutes 15 || true

      - name: Save bot memory for next run
        if: always()
        run: |
          # با always() اجرا می‌شه، پس ممکنه مرحلهٔ قبلی حتی به ساختن data/ هم نرسیده باشه
          cd data || { echo "پوشهٔ data ساخته نشده — چیزی برای ذخیره نیست"; exit 0; }
          # این شاخه در ریپوی عمومی برای همه قابل‌دیدنه — کلیدهای رمزنگاری‌شدهٔ
          # داشبورد هیچ‌وقت نباید واردش بشن (اینجا از GitHub Secrets استفاده می‌شه).
          rm -rf .git secrets.enc secrets.salt
          if [ -z "$(ls -A)" ]; then
            echo "چیزی برای ذخیره نیست — رد می‌شیم"
            exit 0
          fi
          git init -q -b paper-trading-state
          git add -A
          git -c user.email="bot@users.noreply.github.com" -c user.name="paper-trading-bot" \
            commit -q -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:paper-trading-state
