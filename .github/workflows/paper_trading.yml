name: Paper Trading Loop

on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:        # Allow manual trigger from GitHub UI

concurrency:
  group: paper-trading   # اگه اجرای قبلی هنوز تموم نشده، اجرای جدید صف می‌شه نه هم‌زمان —
  cancel-in-progress: false  # وگرنه دو اجرای هم‌زمان روی شاخهٔ paper-trading-state رقابت می‌کنن

permissions:
  contents: write   # لازم برای ذخیرهٔ حافظهٔ ربات در شاخهٔ paper-trading-state

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bot memory from previous run
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin paper-trading-state > /dev/null 2>&1; then
            git fetch --depth=1 origin paper-trading-state
            git archive FETCH_HEAD | tar -x -C data
            echo "حافظهٔ قبلی بازیابی شد"
          else
            echo "حافظهٔ قبلی وجود نداره — شروع از صفر"
          fi

      - name: Run paper trading (single cycle)
        env:
          NOBITEX_ENV: testnet
          NOBITEX_API_KEY: ${{ secrets.NOBITEX_API_KEY }}
          NOBITEX_API_SECRET: ${{ secrets.NOBITEX_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_paper_trading.py --once --approval notify

      - name: Save bot memory for next run
        if: always()
        run: |
          # با always() اجرا می‌شه، پس ممکنه مرحلهٔ قبلی حتی به ساختن data/ هم نرسیده باشه
          cd data || { echo "پوشهٔ data ساخته نشده — چیزی برای ذخیره نیست"; exit 0; }
          # این شاخه در ریپوی عمومی برای همه قابل‌دیدنه — کلیدهای رمزنگاری‌شدهٔ
          # داشبورد هیچ‌وقت نباید واردش بشن (اینجا از GitHub Secrets استفاده می‌شه).
          rm -rf .git secrets.enc secrets.salt
          if [ -z "$(ls -A)" ]; then
            echo "چیزی برای ذخیره نیست — رد می‌شیم"
            exit 0
          fi
          git init -q -b paper-trading-state
          git add -A
          git -c user.email="bot@users.noreply.github.com" -c user.name="paper-trading-bot" \
            commit -q -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:paper-trading-state
